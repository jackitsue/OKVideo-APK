name: Build patched APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare input APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/input
          if [ -f input/OKVideo-original.apk ]; then
            cp input/OKVideo-original.apk work/OKVideo-original.apk
          else
            mapfile -t PARTS < <(find input . -maxdepth 1 -type f \( -name '*.zip.0??' -o -name '*.apk.0??' -o -name '*.part0??' \) | sort -V)
            test "${#PARTS[@]}" -gt 0 || exit 2
            cat "${PARTS[@]}" > work/joined.bin
            if unzip -t work/joined.bin >/dev/null 2>&1; then
              unzip -o work/joined.bin -d work/input
              APK_PATH=$(find work/input -type f -name '*.apk' | head -n 1)
              cp "$APK_PATH" work/OKVideo-original.apk
            else
              cp work/joined.bin work/OKVideo-original.apk
            fi
          fi
          unzip -t work/OKVideo-original.apk >/dev/null
          unzip -p work/OKVideo-original.apk classes3.dex > work/classes3-original.dex
          test -s work/classes3-original.dex

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0"

      - name: Download apktool
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Decode APK for smali patch
        run: |
          java -jar apktool.jar d -f work/OKVideo-original.apk -o work/apk

      - name: Apply download patch
        run: |
          python3 scripts/apply_patch.py work/apk

      - name: Build temporary APK to assemble patched DEX
        run: |
          java -jar apktool.jar b work/apk -o work/temporary-rebuilt.apk
          unzip -p work/temporary-rebuilt.apk classes3.dex > work/classes3-patched.dex
          test -s work/classes3-patched.dex

      - name: Build patched unsigned APK from original
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          src = Path("work/OKVideo-original.apk")
          dex = Path("work/classes3-patched.dex")
          out = Path("work/OKVideo-patched-unsigned.apk")
          remove = {"META-INF/CERT.SF","META-INF/CERT.RSA","META-INF/CERT.DSA","META-INF/MANIFEST.MF"}

          with zipfile.ZipFile(src, "r") as zin, zipfile.ZipFile(out, "w", allowZip64=True) as zout:
              for info in zin.infolist():
                  if info.filename in remove or info.filename == "classes3.dex":
                      continue
                  data = zin.read(info.filename)
                  zi = zipfile.ZipInfo(info.filename, info.date_time)
                  zi.compress_type = info.compress_type
                  zi.comment = info.comment
                  zi.extra = info.extra
                  zi.internal_attr = info.internal_attr
                  zi.external_attr = info.external_attr
                  zi.create_system = info.create_system
                  zi.flag_bits = info.flag_bits & ~0x08
                  zout.writestr(zi, data)
              old = zin.getinfo("classes3.dex")
              zi = zipfile.ZipInfo("classes3.dex", old.date_time)
              zi.compress_type = old.compress_type
              zi.external_attr = old.external_attr
              zi.create_system = old.create_system
              zout.writestr(zi, dex.read_bytes())
          PY
          unzip -t work/OKVideo-patched-unsigned.apk >/dev/null

      - name: Create signing key
        run: |
          keytool -genkeypair -v             -keystore work/debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=OKVideo Debug,O=Local,C=TW"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Build CONTROL APK - no code changes
        run: |
          set -e
          cp work/OKVideo-original.apk work/OKVideo-control-unsigned.apk
          zip -d work/OKVideo-control-unsigned.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 work/OKVideo-control-unsigned.apk work/OKVideo-control-aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks work/debug.keystore             --ks-pass pass:android             --key-pass pass:android             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out work/OKVideo-control-resigned.apk             work/OKVideo-control-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs work/OKVideo-control-resigned.apk
          unzip -t work/OKVideo-control-resigned.apk >/dev/null

      - name: Build PATCHED APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 work/OKVideo-patched-unsigned.apk work/OKVideo-patched-aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks work/debug.keystore             --ks-pass pass:android             --key-pass pass:android             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out work/OKVideo-patched-resigned.apk             work/OKVideo-patched-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs work/OKVideo-patched-resigned.apk
          unzip -t work/OKVideo-patched-resigned.apk >/dev/null

      - name: Generate package diagnostics
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          {
            echo "=== ORIGINAL ==="
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs work/OKVideo-original.apk || true
            "$BUILD_TOOLS/aapt" dump badging work/OKVideo-original.apk || true
            echo
            echo "=== CONTROL RESIGNED ==="
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs work/OKVideo-control-resigned.apk || true
            "$BUILD_TOOLS/aapt" dump badging work/OKVideo-control-resigned.apk || true
            echo
            echo "=== PATCHED RESIGNED ==="
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs work/OKVideo-patched-resigned.apk || true
            "$BUILD_TOOLS/aapt" dump badging work/OKVideo-patched-resigned.apk || true
            echo
            echo "=== SHA256 ==="
            sha256sum work/OKVideo-original.apk work/OKVideo-control-resigned.apk work/OKVideo-patched-resigned.apk
          } > work/package-diagnostics.txt 2>&1

      - name: Upload A-B install test
        uses: actions/upload-artifact@v4
        with:
          name: OKVideo-AB-install-test
          path: |
            work/OKVideo-control-resigned.apk
            work/OKVideo-patched-resigned.apk
            work/package-diagnostics.txt
          if-no-files-found: error
