name: Build patched APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare input APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/input

          if [ -f input/OKVideo-original.apk ]; then
            cp input/OKVideo-original.apk work/OKVideo-original.apk
          else
            mapfile -t PARTS < <(find input . -maxdepth 1 -type f \( -name '*.zip.0??' -o -name '*.apk.0??' -o -name '*.part0??' \) | sort -V)
            if [ "${#PARTS[@]}" -eq 0 ]; then
              echo "No APK or split parts found in repository root or input/"
              echo "Upload split files such as *.zip.001, *.zip.002, ..."
              exit 2
            fi

            echo "Combining split parts:"
            printf '  %s\n' "${PARTS[@]}"
            cat "${PARTS[@]}" > work/joined.bin

            if unzip -t work/joined.bin >/dev/null 2>&1; then
              unzip -o work/joined.bin -d work/input
              APK_PATH=$(find work/input -type f -name '*.apk' | head -n 1 || true)
              if [ -z "${APK_PATH}" ]; then
                echo "Combined ZIP is valid, but no APK was found inside."
                exit 3
              fi
              cp "${APK_PATH}" work/OKVideo-original.apk
            else
              cp work/joined.bin work/OKVideo-original.apk
            fi
          fi

          echo "Prepared APK:"
          ls -lh work/OKVideo-original.apk
          file work/OKVideo-original.apk
          unzip -t work/OKVideo-original.apk >/dev/null

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0"

      - name: Download apktool
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d -f work/OKVideo-original.apk -o work/apk

      - name: Inspect target classes
        run: |
          grep -RIl "DownloadActivity" work/apk/smali* > work/download_refs.txt || true
          grep -RIl "VodFragment" work/apk/smali* > work/vod_refs.txt || true
          grep -RIl "Episode" work/apk/smali* > work/episode_refs.txt || true
          grep -RIn -C 12 "DownloadActivity" work/apk/smali* > work/download_context.txt || true
          grep -RIn -C 12 "Episode" work/apk/smali*/com/fongmi/android/tv/ui 2>/dev/null > work/episode_context.txt || true
          mkdir -p work/targets
          while IFS= read -r p; do [ -f "$p" ] && cp --parents "$p" work/targets/; done < work/download_refs.txt
          while IFS= read -r p; do [ -f "$p" ] && cp --parents "$p" work/targets/; done < work/vod_refs.txt
          while IFS= read -r p; do [ -f "$p" ] && cp --parents "$p" work/targets/; done < work/episode_refs.txt
          tar -czf work/target-smali.tar.gz -C work/targets . || true
          echo "Download refs:"; cat work/download_refs.txt || true
          echo "Vod refs:"; cat work/vod_refs.txt || true
          echo "Episode refs:"; cat work/episode_refs.txt || true

      - name: Upload inspection data
        uses: actions/upload-artifact@v4
        with:
          name: OKVideo-smali-inspection
          path: |
            work/download_refs.txt
            work/vod_refs.txt
            work/episode_refs.txt
            work/download_context.txt
            work/episode_context.txt
            work/target-smali.tar.gz
          if-no-files-found: warn

      - name: Apply patch
        run: |
          python3 scripts/apply_patch.py work/apk

      - name: Rebuild
        run: |
          java -jar apktool.jar b work/apk -o work/OKVideo-unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore work/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=OKVideo Debug,O=Local,C=TW" -keyalg RSA -keysize 2048 -validity 10000

      - name: Align and sign
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 work/OKVideo-unsigned.apk work/OKVideo-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks work/debug.keystore --ks-pass pass:android --key-pass pass:android --out work/OKVideo-download.apk work/OKVideo-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose work/OKVideo-download.apk

      - name: Upload APK and inspection logs
        uses: actions/upload-artifact@v4
        with:
          name: OKVideo-download-APK
          path: |
            work/OKVideo-download.apk
            work/download_refs.txt
            work/vod_refs.txt
            work/episode_refs.txt
          if-no-files-found: error
